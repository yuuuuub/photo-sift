import java.util.Properties

// 发布签名配置
// 1) 把 tiaopian-release.jks 放到 android/app/ 目录（或通过 TIAPOPIAN_STORE_FILE 指定绝对路径）
// 2) 在 android/keystore.properties 里填 storePassword / keyAlias / keyPassword
// 3) 两个文件都在 .gitignore 里，不会进仓库
//
// 缺少配置时 release 构建会继续用 debug 签名并给出警告，方便本地自测；
// 需要正式发布时请务必补齐配置。

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def storeFilePath = System.getenv("TIAPOPIAN_STORE_FILE") ?: keystoreProps.getProperty("storeFile")
def storeFileResolved = null
if (storeFilePath) {
    def candidate = file(storeFilePath)
    if (candidate.exists()) {
        storeFileResolved = candidate
    } else {
        def fallback = rootProject.file(storeFilePath)
        if (fallback.exists()) storeFileResolved = fallback
    }
}

def hasReleaseKeystore = storeFileResolved != null &&
    keystoreProps.getProperty("storePassword") &&
    keystoreProps.getProperty("keyAlias") &&
    keystoreProps.getProperty("keyPassword")

android {
    defaultConfig {
        // 版本号：正式版从这里递增，覆盖安装依赖 versionCode 单调递增
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile storeFileResolved
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("WARNING: keystore.properties / tiaopian-release.jks 缺失，release 构建将使用 debug 签名。")
            }
        }
    }
}
